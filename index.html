<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef it up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>
            Chef it up!
        </h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="favorites.html">Favorites</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <section class="search_section">
            <h2>What is in your kitchen?</h2>
            <P>Turn any ingredient that you currently have into a full meal!</P>
            <form>     
                <input class="ingredient_search" 
                type="text"
                id="ingredient"
                name="ingredient"
                placeholder="Enter an ingredient...">
                <button class="custom_button">Search Recipies</button>
            </form>
        </section>
        <h2>Recipes</h2>
        <section class="recipes">
            <br>
            <article class="recipe_card">
                <img src="./assets/chicken-taco-5-of-5.jpg" alt="chicken tacos">
                <div class="recipe_info">
                <h3>Chicken Tacos</h3>
                <p>Easy chicken tacos with simple toppings</p>
                <p>Preperation Time: 25 minutes</p>
                <button>View Recipe</button>
                </div>
            </article>
            <article class="recipie_card">
                <img src="./assets/Classic-Chicken-Salad-4.jpg" alt="chicken salad">
                <div class="recipe_info">
                    <h3>Chicken Salad</h3>
                    <p>Fresh chicken salad</p>
                    <p>Preperation Time: 30 minutes</p>
                    <button>View Recipe</button>
                </div>
            </article>
            <article class="recipie_card"></article>
        </section>
    </main>
</body>
</html>
